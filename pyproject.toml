[project]
name = "ticket-routing-service"
version = "0.1.0"
description = "Ticket routing service"
readme = "README.md"
authors = [
    { name = "niyazgulov", email = "nzg2112@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "numpy",
    "onnxruntime",
]

[project.scripts]
ticket-routing-service = "ticket_routing_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets",
    "fastparquet",
    "ipykernel",
    "mlflow",
    "numpy",
    "onnx",
    "onnxruntime",
    "optimum[exporters]",
    "optuna",
    "pandas",
    "peft",
    "ruff",
    "scikit-learn",
    "torch",
    "transformers==4.36.2",
]

[tool.uv]
package = false
